# XcodeGen spec for the macOS native parts (apple/README.md). scripts/build_apple.py generates
# Solaris.xcodeproj from it next to this file; the project is not committed.
name: Solaris
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    # Developer ID, signed by hand with the team's certificate. Builds without the certificate
    # pass CODE_SIGNING_ALLOWED=NO (scripts/build_apple.py without --sign).
    DEVELOPMENT_TEAM: GY9ZKZMAZA
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: Developer ID Application
    ENABLE_HARDENED_RUNTIME: YES
    # Outside archives Xcode adds get-task-allow, which the Developer ID profiles do not allow
    # and notarization rejects; the signed entitlements are exactly the .entitlements files.
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Notarization needs a secure timestamp.
    OTHER_CODE_SIGN_FLAGS: --timestamp
targets:
  # SolarisManager.dylib: the C interface the Python host loads with ctypes.
  SolarisManager:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Manager
        headerVisibility: project
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: SystemExtensions.framework
    settings:
      base:
        PRODUCT_NAME: SolarisManager
        EXECUTABLE_PREFIX: ""
        LD_DYLIB_INSTALL_NAME: "@rpath/SolarisManager.dylib"
        # Imports SolarisManager.h so that each export is checked against its declaration.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Manager
        SKIP_INSTALL: YES
  # dev.tschen.solaris.tunnel.systemextension: the packet tunnel provider with the Go dispatcher.
  SolarisTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: Tunnel
      # The GEO data the core copies into its home on attach (docs/routing.md §8.4), fetched
      # into build/geodata by scripts/build_apple.py.
      - path: ../build/geodata/GeoSite.dat
        buildPhase: resources
      - path: ../build/geodata/GeoIP.dat
        buildPhase: resources
    dependencies:
      # Built from src/core/apple by scripts/build_apple.py.
      - framework: ../build/apple/SolarisCore.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tschen.solaris.tunnel
        # A system extension's bundle is named after its identifier.
        PRODUCT_NAME: dev.tschen.solaris.tunnel
        PRODUCT_MODULE_NAME: SolarisTunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/SolarisTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: Solaris Tunnel Developer ID
        SKIP_INSTALL: YES
schemes:
  Solaris:
    build:
      targets:
        SolarisManager: all
        SolarisTunnel: all
