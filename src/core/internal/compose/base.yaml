# The base section of every composed configuration (docs/routing.md §8.6). The core owns
# it and it changes with releases; users adjust it through the global override. The
# admission pipeline still applies the host's options, the platform patches and the
# security items after it (docs/architecture.md §3.2).
mode: rule
log-level: info
mixed-port: 7890
unified-delay: true
tcp-concurrent: true
profile:
  store-selected: true
  store-fake-ip: true

# GEO data: .dat files for GEOSITE and GEOIP, read on demand (memconservative). The
# installer ships a copy; the core refreshes it every geo-update-interval hours from geox-url.
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geosite: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat
  geoip: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat
  mmdb: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb
  asn: https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "geosite:private"
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "+.stun.*.*"
    - "+.stun.*.*.*"
  # Resolves the DoH servers' own names.
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # Everything else, sent the way the rules send traffic to these servers.
  respect-rules: true
  nameserver:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  # Domestic names go to domestic DoH servers, directly.
  nameserver-policy:
    "geosite:cn,private":
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
  # The proxy servers' own names, resolved directly and apart from everything else.
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
