# 配置模板：替换示例地址、端口和 CHANGE_ME 参数后再导入。
# 参数与限制见 ../../mihomo-fork.md。MATCH 规则将流量交给 PROXY。
mode: rule

proxies:
  - name: Naive-H2
    type: naive
    server: proxy.example.com
    port: 443
    username: 'CHANGE_ME_USERNAME'
    password: 'CHANGE_ME_PASSWORD'
    sni: proxy.example.com
    quic: false

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Naive-H2

rules:
  - MATCH,PROXY
