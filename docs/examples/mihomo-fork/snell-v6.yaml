# 配置模板：替换示例地址、端口和 CHANGE_ME 参数后再导入。
# 参数与限制见 ../../mihomo-fork.md。MATCH 规则将流量交给 PROXY。
mode: rule

proxies:
  - name: Snell-v6
    type: snell
    server: proxy.example.com
    port: 44046
    psk: 'CHANGE_ME_SNELL_PSK'
    version: 6
    mode: default
    udp: false
    reuse: false

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - Snell-v6

rules:
  - MATCH,PROXY
