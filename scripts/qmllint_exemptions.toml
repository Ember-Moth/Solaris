# qmllint findings that cannot be fixed in the QML, one entry each (scripts/qmllint.py).
# `message` is a substring of the finding's message; an entry that no longer matches any
# finding fails the check, so the list only holds what is still needed.

# qmllint 6.12 does not read the `singleton` lines of the qmldir beside a file when it lints
# that file, so every singleton is reported as undeclared; a directory holding only that
# qmldir line and a `pragma Singleton` QtObject reproduces it. components/qmldir declares all
# five, and the running app loads them as singletons.
[[exemption]]
file = "components/Theme.qml"
category = "import"
message = "Type Theme not declared as singleton in qmldir"
reason = "qmllint ignores the singleton lines of the file's own qmldir"

