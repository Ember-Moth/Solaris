name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: "5"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      jobs: ${{ steps.select.outputs.jobs }}
      protocol: ${{ steps.select.outputs.protocol }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks from the complete change range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_changes.py > "$RUNNER_TEMP/selection.json"
          cat "$RUNNER_TEMP/selection.json"
      # The script cannot vouch for a change to itself. Unless the one that ran is the one at
      # the start of the range (the pull request's base; a push's successful baseline and
      # previous head), every check runs, whatever it selected. Read with the runner's Python.
      - name: Every check when the selection script changed
        id: select
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SELECTION: ${{ runner.temp }}/selection.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          # Every job below that the selection names; tests/test_ci_changes.py keeps it whole.
          EVERY = ['apple', 'e2e', 'go', 'installer-ui', 'python', 'tun', 'windows-arm64-upgrade', 'windows-installer']
          SCRIPT = 'scripts/ci_changes.py'

          def commit(value):
              return value if re.fullmatch(r'[0-9a-f]{40}', value or '') and value != '0' * 40 else None

          def same_script(base):
              # git diff exits 1 for a difference and 128 for a commit it does not have.
              return base is not None and subprocess.run(
                  ['git', 'diff', '--quiet', '--no-renames', base, 'HEAD', '--', SCRIPT]
              ).returncode == 0

          try:
              with open(os.environ['SELECTION'], encoding='utf-8') as stream:
                  selection = json.load(stream)
              jobs, protocol, base = selection['jobs'], selection['protocol'] is True, selection['base']
          except (OSError, ValueError, KeyError, TypeError):
              selection = None
          event = os.environ['EVENT']
          if selection is None:
              trusted = False
          elif event == 'pull_request':
              trusted = same_script(commit(os.environ['PR_BASE']))
          elif event == 'push':
              before = commit(os.environ['BEFORE'])
              trusted = same_script(commit(base)) and (before is None or same_script(before))
          else:
              trusted = False
          if not trusted:
              jobs, protocol = EVERY, True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"jobs={json.dumps(sorted(jobs), separators=(',', ':'))}\nprotocol={str(protocol).lower()}\n")
          if not trusted:
              print(f'{SCRIPT} changed in this range, or its selection is unreadable: every check runs')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(f'\nEvery check runs: `{SCRIPT}` is not the one at the start of the range.\n')
          PY

  python:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'python')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            python_arch: aarch64
          - os: macos-26-intel
            python_arch: x86_64
          - os: windows-latest
            python_arch: x86_64
          - os: windows-11-arm
            python_arch: aarch64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
      CGO_ENABLED: ${{ matrix.os == 'windows-11-arm' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - uses: actions/setup-node@v7  # pyright runs on Node
        with:
          node-version: "22"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint and format
        if: matrix.os == 'macos-26'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      # Theme and translation freshness are covered by pytest, once per platform.
      - name: Protocol bindings are current
        if: matrix.os == 'macos-26' && needs.changes.outputs.protocol == 'true'
        run: uv run python scripts/gen_protocol.py --check
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q
      # The ARM64 build's Nuitka plugin against the function it replaces, under the build's
      # Nuitka and its own copy of pefile, which it installs only on Windows.
      - name: Nuitka dependency plugin
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
          SOLARIS_NUITKA_TESTS: "1"
        run: uv run --frozen --with nuitka==4.2.2 pytest -q tests/test_nuitka_pefile.py

  # The UI against the real development service (docs/architecture.md §11): no TUN, only
  # loopback traffic to local servers through the mixed port.
  e2e:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'e2e')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Install (locked)
        run: uv sync --frozen
      # The GEO data the installers ship, for the "my plan" tests; the pin is in the script.
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: GEO data and its category list
        run: uv run python scripts/fetch_geodata.py --check
      - name: Build the development service
        run: go -C src/core build -o "$RUNNER_TEMP/solaris-service" ./service
      - name: End-to-end tests
        env:
          QT_QPA_PLATFORM: offscreen
          SOLARIS_E2E: "1"
          SOLARIS_E2E_SERVICE: ${{ runner.temp }}/solaris-service
        run: uv run pytest -q tests/e2e

  go:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'go')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-26-intel, windows-latest, windows-11-arm, ubuntu-latest]
    env:
      CGO_ENABLED: ${{ matrix.os == 'windows-11-arm' && '0' || '1' }}
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      - name: Race detector
        # Go 1.27's race runtime supports Windows amd64, not Windows arm64.
        if: runner.os != 'Windows' || runner.arch != 'ARM64'
        run: go test -race ./...
      - name: Fork outbounds (macOS native Cronet)
        if: runner.os == 'macOS'
        run: go test -race -tags with_gvisor,with_naive -run '^TestFork' ./internal/engine
      - name: Fork outbounds (Windows native Cronet)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $arch = go env GOARCH
          $native = go mod download -json "github.com/sagernet/cronet-go/lib/windows_$arch" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$($native.Dir);$env:PATH"
          $race = @()
          if ($arch -eq 'amd64') { $race += '-race' }
          go test @race -tags with_gvisor,with_naive,with_purego -run '^(TestFork|TestNaiveRuntime)' ./internal/engine ./service
      # Tailscale's outbound only builds with with_gvisor, so the security and mesh tests run
      # once more with it: its state-dir held to the home (docs/mesh.md §4), and the fields
      # its status is read from (§10.1).
      - name: Security and mesh tests with with_gvisor
        if: runner.os == 'Linux'
        run: go test -race -tags with_gvisor -run '^(TestSecurity|TestMesh|TestNetworks)' ./internal/engine
      - name: Windows service cross-build
        if: runner.os == 'Linux'
        run: |
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -tags with_gvisor,with_naive,with_purego -o /dev/null ./service
          done
      - name: macOS extension archive
        if: runner.os == 'macOS'
        run: go build -buildmode=c-archive -o "$RUNNER_TEMP/libsolaris.a" ./apple

  # The universal macOS app and system extension (apple/README.md), signed ad hoc;
  # Developer ID signing and notarization belong to the release workflow.
  # Match the app's minimum supported macOS version (D28), as the release job does.
  apple:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'apple')
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      # The GEO data the extension carries in its resources; the pin is in the script.
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: Rosetta for the x64 Python compiler
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
      - name: Install (locked)
        run: uv sync --frozen
      # Compile and merge the real UI, Python/Qt libraries, manager and Go/Cronet extension.
      # The builder checks every Mach-O for both slices before ad hoc signing.
      - name: Build universal app (unsigned)
        run: uv run --frozen --with nuitka==4.2.2 python scripts/build_app.py --unsigned
      # The release's actual universal app in a disk image.
      - name: Disk image
        run: |
          uv run --no-project --with dmgbuild==1.6.7 python scripts/build_dmg.py \
            build/app/Solaris.app "$RUNNER_TEMP/Solaris-universal.dmg"

      - name: Retain universal disk image
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal-${{ github.sha }}
          path: ${{ runner.temp }}/Solaris-universal.dmg
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

      # The packaged UI starts natively and under Rosetta, opens its window and quits when a
      # second start asks it to, recording no crash. Nothing connects, so the extension is
      # never activated; ad hoc signed, the app could not activate it anyway. The window is
      # looked up by process in CGWindowListCopyWindowInfo, which needs no permission.
      - name: Start the UI on both architectures
        env:
          QT_FORCE_STDERR_LOGGING: "1"  # Qt's messages, a qFatal's reason among them
        run: |
          ui=build/app/Solaris.app/Contents/MacOS/SolarisUI
          data="$HOME/Library/Application Support/Solaris"
          output="$RUNNER_TEMP/solaris-ui"
          mkdir -p "$output"
          cat > "$RUNNER_TEMP/has-window.swift" <<'SWIFT'
          import CoreGraphics
          import Foundation

          // Exits 0 when the process has an ordinary window (layer 0) on screen.
          let pid = Int(CommandLine.arguments[1])!
          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
          exit(windows.contains {
            $0[kCGWindowOwnerPID as String] as? Int == pid && $0[kCGWindowLayer as String] as? Int == 0
          } ? 0 : 1)
          SWIFT
          xcrun swiftc -O -o "$RUNNER_TEMP/has-window" "$RUNNER_TEMP/has-window.swift"

          # A child that has exited stays a zombie until waited for.
          alive() { [[ "$(ps -o stat= -p "$1" 2> /dev/null)" =~ ^[^Z] ]]; }
          fail() {
            echo "::error::$1"
            [[ -d "$data/crashes" ]] && cp -R "$data/crashes" "$output/"
            find "$HOME/Library/Logs/DiagnosticReports" -name 'SolarisUI*' -exec cp {} "$output/" \; 2> /dev/null || true
            for log in "$output"/*.err "$output"/crashes/ui-*.log; do
              [[ -s "$log" ]] || continue
              echo "::group::$log"
              cat "$log"
              echo "::endgroup::"
            done
            exit 1
          }
          for arch in arm64 x86_64; do
            arch "-$arch" "$ui" > "$output/$arch.out" 2> "$output/$arch.err" &
            pid=$!
            for _ in $(seq 180); do
              alive "$pid" || break
              "$RUNNER_TEMP/has-window" "$pid" && break
              sleep 1
            done
            if ! alive "$pid"; then
              status=0
              wait "$pid" || status=$?
              fail "The $arch UI exited with $status while starting"
            fi
            if ! "$RUNNER_TEMP/has-window" "$pid"; then
              kill "$pid" 2> /dev/null || true
              fail "The $arch UI opened no window in 180 seconds"
            fi
            echo "The $arch UI ($pid) opened its window"
            if ! "$ui" --quit; then
              kill "$pid" 2> /dev/null || true
              fail "SolarisUI --quit did not reach the $arch UI"
            fi
            for _ in $(seq 30); do
              alive "$pid" || break
              sleep 1
            done
            if alive "$pid"; then
              kill "$pid" 2> /dev/null || true
              fail "The $arch UI did not quit within 30 seconds of --quit"
            fi
            status=0
            wait "$pid" || status=$?
            [[ "$status" -eq 0 ]] || fail "The $arch UI exited with $status after --quit"
            # faulthandler's log of a clean exit is empty and removed; any other is a crash.
            if compgen -G "$data/crashes/ui-*.log" > /dev/null; then
              fail "The $arch UI recorded a crash or an unhandled exception"
            fi
          done

      - name: Keep the UI's output and crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: macos-ui-${{ github.sha }}
          path: ${{ runner.temp }}/solaris-ui/
          if-no-files-found: ignore
          retention-days: 14

  installer-ui:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'installer-ui')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python_arch: x86_64
          - os: windows-11-arm
            arch: arm64
            python_arch: aarch64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify custom install directory security
        shell: powershell
        run: ./package/windows/path-smoke-test.ps1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Build the custom Win32 surface and read-only harness
        run: uv run --frozen python scripts/build_installer_ui.py --preview --arch ${{ matrix.arch }}
      - name: Exercise installer UI and capture screenshots
        shell: powershell
        run: ./package/windows/ui-smoke-test.ps1 -Preview build/installer-ui/Solaris-setup-preview.exe -Output build/installer-ui/screenshots -Architecture ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-ui-${{ matrix.arch }}-${{ github.sha }}
          path: |
            build/installer-ui/screenshots/
            build/installer-ui/SolarisSetupUI.dll
            build/installer-ui/SolarisSetupUI.pdb
            build/installer-ui/Solaris-setup-preview.exe
          if-no-files-found: ignore
          retention-days: 14

  # The unsigned Windows installer (docs/architecture.md §9, §10), then installed, upgraded and
  # uninstalled on the runner by package/windows/smoke-test.ps1: the service starts and listens
  # on its pipe, the UI opens its window. No TUN, no connection.
  windows-installer:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-installer')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python_arch: x86_64
            build: build/windows
          - os: windows-11-arm
            arch: arm64
            python_arch: aarch64
            build: build/windows-arm64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
      NUITKA_CACHE_DIR: ${{ github.workspace }}\build\nuitka-cache-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Install (locked)
        run: uv sync --frozen
      - name: Installer cleanup regression
        run: uv run --frozen pytest -q tests/test_build_windows.py -k "removal_routine or readonly_owned_files or locked_old_extension"
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      # Nuitka's compiled C: most of it is the dependencies', which change with the lock.
      - uses: actions/cache@v6
        with:
          path: build/nuitka-cache-${{ matrix.arch }}
          key: nuitka-windows-${{ matrix.arch }}-${{ hashFiles('uv.lock', 'scripts/build_windows.py', 'package/windows/nuitka_pefile.py') }}
      - name: Build (unsigned)
        run: uv run --frozen --with nuitka==4.2.2 python scripts/build_windows.py --arch ${{ matrix.arch }}
      - name: Install, upgrade and uninstall
        shell: powershell
        run: ./package/windows/smoke-test.ps1 -Installer (Get-Item ${{ matrix.build }}/Solaris-*-windows-${{ matrix.arch }}-setup.exe).FullName
      # The UI's output from each start, and the crash directory of one that died starting.
      - name: Keep the UI's output and crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-ui-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/solaris-ui/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ matrix.build }}/Solaris-*-windows-${{ matrix.arch }}-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  windows-arm64-upgrade:
    needs: [changes, windows-installer]
    if: contains(fromJSON(needs.changes.outputs.jobs), 'windows-arm64-upgrade')
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-x64-${{ github.sha }}
          path: build/migration/x64
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-arm64-${{ github.sha }}
          path: build/migration/arm64
      - name: Upgrade an emulated x64 installation to native ARM64
        shell: powershell
        run: ./package/windows/arm64-upgrade-smoke-test.ps1 -X64Installer (Get-Item build/migration/x64/*.exe).FullName -ARM64Installer (Get-Item build/migration/arm64/*.exe).FullName

  # The owned-TUN and fd-mode tests create a real TUN, so they run only here, inside network
  # namespaces (docs/architecture.md §11). md-tun holds the engine; md-srv, on the
  # far side of a veth pair, serves the page the test fetches through the TUN and echoes
  # the UDP it sends. The servers listen on 10.201.0.1, off md-tun's link: auto-route leaves
  # on-link destinations to the main table, so a server on 10.200.0.0/24 would bypass the TUN.
  tun:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.jobs), 'tun')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: tuntest
            stacks: system,mips
          - tags: tuntest,with_gvisor
            stacks: gvisor,mixed
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Build the TUN test
        run: go test -c -tags "${{ matrix.tags }}" -o "$RUNNER_TEMP/engine-tun.test" ./internal/engine
      - name: Network namespaces
        run: |
          sudo ip netns add md-tun
          sudo ip netns add md-srv
          sudo ip link add md-veth0 type veth peer name md-veth1
          sudo ip link set md-veth0 netns md-tun
          sudo ip link set md-veth1 netns md-srv
          sudo ip -n md-tun addr add 10.200.0.2/24 dev md-veth0
          sudo ip -n md-srv addr add 10.200.0.1/24 dev md-veth1
          sudo ip -n md-srv addr add 10.201.0.1/32 dev lo
          for ns in md-tun md-srv; do sudo ip -n "$ns" link set lo up; done
          sudo ip -n md-tun link set md-veth0 up
          sudo ip -n md-srv link set md-veth1 up
          sudo ip -n md-tun route add default via 10.200.0.1
          # The kernel adds the local route of md-veth0's IPv6 link-local address once
          # duplicate address detection is done, a second or two after the link comes up.
          # The owned-TUN test compares every table before and after, so wait for it here.
          for _ in $(seq 100); do
            sudo ip -n md-tun -6 addr show dev md-veth0 scope link -tentative | grep -q inet6 && break
            sleep 0.1
          done
      - name: Owned TUN in md-tun
        run: |
          resolvectl dns > "$RUNNER_TEMP/dns-before"
          resolvectl domain >> "$RUNNER_TEMP/dns-before"
          mkdir -p "$RUNNER_TEMP/www"
          echo through-tun > "$RUNNER_TEMP/www/index.html"
          # Keep the log runner-owned; only the server needs the namespace's privileges.
          # shellcheck disable=SC2024
          sudo ip netns exec md-srv python3 -m http.server 8080 --bind 10.201.0.1 \
            --directory "$RUNNER_TEMP/www" > "$RUNNER_TEMP/http.log" 2>&1 &
          # shellcheck disable=SC2024
          sudo ip netns exec md-srv python3 -c '
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.setsockopt(socket.SOL_SOCKET, socket.SO_RCVBUF, 1 << 20)
          s.bind(("10.201.0.1", 8081))
          while True:
              data, peer = s.recvfrom(65535)
              s.sendto(data, peer)
          ' > "$RUNNER_TEMP/udp.log" 2>&1 &
          for _ in $(seq 50); do
            sudo ip netns exec md-tun curl -fsS --max-time 1 http://10.201.0.1:8080/ && break
            sleep 0.2
          done
          sudo env SOLARIS_TUN_TEST=1 \
            SOLARIS_TUN_TARGET=http://10.201.0.1:8080/ \
            SOLARIS_TUN_UDP_TARGET=10.201.0.1:8081 \
            SOLARIS_TUN_OUTBOUND=md-veth0 \
            SOLARIS_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestOwnedTUN$' -test.v -test.count=1
      # fd mode as the macOS extension runs it: the test creates the TUN and its route, hands
      # the descriptor to the engine, and mihomo's own dials leave through md-veth0.
      - name: fd mode in md-tun
        run: |
          sudo env SOLARIS_TUN_TEST=1 \
            SOLARIS_TUN_TARGET=http://10.201.0.1:8080/ \
            SOLARIS_TUN_UDP_TARGET=10.201.0.1:8081 \
            SOLARIS_TUN_OUTBOUND=md-veth0 \
            SOLARIS_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestFDTUN$' -test.v -test.count=1
      # systemd-resolved serves the runner, outside the namespaces, yet takes interface
      # indexes from inside them over D-Bus: sing-tun's resolvectl calls for mdtun0 land on
      # whichever runner interface has the same index. Left there, they cut the runner off
      # its DNS and the job hangs after its last step, so fail here instead.
      - name: Runner DNS untouched
        run: |
          sleep 1
          resolvectl dns > "$RUNNER_TEMP/dns-after"
          resolvectl domain >> "$RUNNER_TEMP/dns-after"
          diff "$RUNNER_TEMP/dns-before" "$RUNNER_TEMP/dns-after"

  result:
    name: CI result
    if: always()
    needs: [changes, python, e2e, go, apple, installer-ui, windows-installer, windows-arm64-upgrade, tun]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.changes.outputs.jobs }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['CHECK_RESULTS'])
          if results['changes']['result'] != 'success':
              raise SystemExit('CI selection failed or was cancelled')
          selected = json.loads(os.environ['SELECTED_JOBS'])
          available = set(results) - {'changes'}
          if not isinstance(selected, list) or any(not isinstance(job, str) or job not in available for job in selected):
              raise SystemExit('Invalid CI selection output')
          failed = {job: info['result'] for job, info in results.items()
                    if info['result'] not in {'success', 'skipped'}
                    or (job in selected and info['result'] != 'success')}
          if failed:
              raise SystemExit(f'CI checks did not succeed: {failed}')
          print('Selected CI checks passed' if selected else 'Documentation-only or empty change: no code checks required')
          PY
