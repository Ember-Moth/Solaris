name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_RETRIES: "5"

jobs:
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - uses: actions/setup-node@v7  # pyright runs on Node
        with:
          node-version: "22"
      - name: Install (locked)
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Generated files are current
        if: runner.os == 'macOS'
        run: |
          uv run python scripts/gen_protocol.py --check
          uv run python scripts/gen_theme.py --check
          uv run python scripts/gen_i18n.py --check
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

  # The UI against the real development service (docs/architecture.md §11): no TUN, only
  # loopback traffic to local servers through the mixed port.
  e2e:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Install (locked)
        run: uv sync --frozen
      # The GEO data the installers ship, for the "my plan" tests; the pin is in the script.
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: GEO data and its category list
        run: uv run python scripts/fetch_geodata.py --check
      - name: Build the development service
        run: go -C src/core build -o "$RUNNER_TEMP/solaris-service" ./service
      - name: End-to-end tests
        env:
          QT_QPA_PLATFORM: offscreen
          SOLARIS_E2E: "1"
          SOLARIS_E2E_SERVICE: ${{ runner.temp }}/solaris-service
        run: uv run pytest -q tests/e2e

  go:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Format
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...
      # Tailscale's outbound only builds with with_gvisor, so the security and mesh tests run
      # once more with it: its state-dir held to the home (docs/mesh.md §4), and the fields
      # its status is read from (§10.1).
      - name: Security and mesh tests with with_gvisor
        if: runner.os == 'Linux'
        run: go test -tags with_gvisor -run '^(TestSecurity|TestMesh|TestNetworks)' ./internal/engine
      - name: Windows service cross-build
        if: runner.os == 'Linux'
        run: GOOS=windows GOARCH=amd64 go build -o /dev/null ./service
      - name: macOS extension archive
        if: runner.os == 'macOS'
        run: go build -buildmode=c-archive -o "$RUNNER_TEMP/libsolaris.a" ./apple

  # The macOS manager library and system extension (apple/README.md), built unsigned so that the
  # Xcode project keeps compiling; signing and notarization belong to the release workflow.
  # XcodeGen's projects need Xcode 16 or later, which macos-15 runs by default.
  apple:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      # The GEO data the extension carries in its resources; the pin is in the script.
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      # The script needs only the standard library, so skip installing the project. It builds
      # the Go archive with the extension's tags, with_gvisor.
      - name: Build (unsigned)
        run: uv run --no-project python scripts/build_apple.py --tags with_gvisor

  # The unsigned Windows installer (docs/architecture.md §9, §10), then installed, upgraded and
  # uninstalled on the runner by package/windows/smoke-test.ps1: the service starts and listens
  # on its pipe, the UI opens its window. No TUN, no connection.
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\build\nuitka-cache
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Install (locked)
        run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      # Nuitka's compiled C: most of it is the dependencies', which change with the lock.
      - uses: actions/cache@v6
        with:
          path: build/nuitka-cache
          key: nuitka-windows-${{ hashFiles('uv.lock', 'scripts/build_windows.py') }}
      - name: Build (unsigned)
        run: uv run --frozen --with nuitka==4.2.2 python scripts/build_windows.py
      - name: Install, upgrade and uninstall
        run: ./package/windows/smoke-test.ps1 -Installer (Get-Item build/windows/Solaris-*-windows-x64-setup.exe).FullName

  # The owned-TUN and fd-mode tests create a real TUN, so they run only here, inside network
  # namespaces (docs/architecture.md §11). md-tun holds the engine; md-srv, on the
  # far side of a veth pair, serves the page the test fetches through the TUN. The
  # server listens on 10.201.0.1, off md-tun's link: auto-route leaves on-link
  # destinations to the main table, so a server on 10.200.0.0/24 would bypass the TUN.
  tun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: tuntest
            stacks: system,mips
          - tags: tuntest,with_gvisor
            stacks: gvisor,mixed
    defaults:
      run:
        working-directory: src/core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Build the TUN test
        run: go test -c -tags "${{ matrix.tags }}" -o "$RUNNER_TEMP/engine-tun.test" ./internal/engine
      - name: Network namespaces
        run: |
          sudo ip netns add md-tun
          sudo ip netns add md-srv
          sudo ip link add md-veth0 type veth peer name md-veth1
          sudo ip link set md-veth0 netns md-tun
          sudo ip link set md-veth1 netns md-srv
          sudo ip -n md-tun addr add 10.200.0.2/24 dev md-veth0
          sudo ip -n md-srv addr add 10.200.0.1/24 dev md-veth1
          sudo ip -n md-srv addr add 10.201.0.1/32 dev lo
          for ns in md-tun md-srv; do sudo ip -n "$ns" link set lo up; done
          sudo ip -n md-tun link set md-veth0 up
          sudo ip -n md-srv link set md-veth1 up
          sudo ip -n md-tun route add default via 10.200.0.1
      - name: Owned TUN in md-tun
        run: |
          resolvectl dns > "$RUNNER_TEMP/dns-before"
          resolvectl domain >> "$RUNNER_TEMP/dns-before"
          mkdir -p "$RUNNER_TEMP/www"
          echo through-tun > "$RUNNER_TEMP/www/index.html"
          sudo ip netns exec md-srv python3 -m http.server 8080 --bind 10.201.0.1 \
            --directory "$RUNNER_TEMP/www" > "$RUNNER_TEMP/http.log" 2>&1 &
          for _ in $(seq 50); do
            sudo ip netns exec md-tun curl -fsS --max-time 1 http://10.201.0.1:8080/ && break
            sleep 0.2
          done
          sudo env SOLARIS_TUN_TEST=1 \
            SOLARIS_TUN_TARGET=http://10.201.0.1:8080/ \
            SOLARIS_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestOwnedTUN$' -test.v -test.count=1
      # fd mode as the macOS extension runs it: the test creates the TUN and its route, hands
      # the descriptor to the engine, and mihomo's own dials leave through md-veth0.
      - name: fd mode in md-tun
        run: |
          sudo env SOLARIS_TUN_TEST=1 \
            SOLARIS_TUN_TARGET=http://10.201.0.1:8080/ \
            SOLARIS_TUN_OUTBOUND=md-veth0 \
            SOLARIS_TUN_STACKS="${{ matrix.stacks }}" \
            ip netns exec md-tun "$RUNNER_TEMP/engine-tun.test" -test.run '^TestFDTUN$' -test.v -test.count=1
      # systemd-resolved serves the runner, outside the namespaces, yet takes interface
      # indexes from inside them over D-Bus: sing-tun's resolvectl calls for mdtun0 land on
      # whichever runner interface has the same index. Left there, they cut the runner off
      # its DNS and the job hangs after its last step, so fail here instead.
      - name: Runner DNS untouched
        run: |
          sleep 1
          resolvectl dns > "$RUNNER_TEMP/dns-after"
          resolvectl domain >> "$RUNNER_TEMP/dns-after"
          diff "$RUNNER_TEMP/dns-before" "$RUNNER_TEMP/dns-after"
