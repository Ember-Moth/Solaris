name: Release

# The signed and notarized macOS build (apple/README.md): Solaris.app from scripts/build_app.py,
# notarized and stapled, in a notarized disk image with its SHA-256. And the Windows installers
# from scripts/build_windows.py, signed with Azure Artifact Signing (D42), with their SHA-256.
# Runs for v* tags and by hand, in the release environment: its reviewers approve each run
# before the jobs get the signing secrets, the Azure sign-in and the Google OAuth client. For a
# tag, a last job puts all three installers, SHA256SUMS and the source archive into a draft
# GitHub Release (docs/release.md §1), which a person publishes.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_HTTP_RETRIES: "5"

jobs:
  macos:
    name: macOS universal (signed and notarized)
    # The app needs macOS 26 (D28), so the release is built and checked on that system.
    runs-on: macos-26
    environment: release
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Install (locked)
        run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: Version
        id: version
        run: |
          version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dmg=Solaris-$version-macos-universal.dmg" >> "$GITHUB_OUTPUT"

      # A keychain of its own holds the certificate; the two profiles go where Xcode and
      # scripts/build_apple.py look for them by name. The build checks the rest: the identity
      # is the team's Developer ID Application certificate that both profiles authorize, the
      # app may install system extensions and the extension may be a packet tunnel.
      - name: Signing materials
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          MACOS_CERTIFICATE_NAME: ${{ vars.MACOS_CERTIFICATE_NAME }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_PROFILE_BASE64: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          MACOS_NETWORK_EXTENSION_PROFILE_BASE64: ${{ secrets.MACOS_NETWORK_EXTENSION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          signing="$RUNNER_TEMP/signing"
          mkdir -m 700 "$signing"
          echo "SIGNING=$signing" >> "$GITHUB_ENV"
          if ! grep -qx "TEAM = \"$APPLE_TEAM_ID\"" scripts/build_apple.py; then
            echo "::error::APPLE_TEAM_ID is not the team in scripts/build_apple.py"
            exit 1
          fi
          if [[ "$MACOS_CERTIFICATE_NAME" != "Developer ID Application: "*" ($APPLE_TEAM_ID)" ]]; then
            echo "::error::MACOS_CERTIFICATE_NAME is not a Developer ID Application certificate of the team"
            exit 1
          fi

          keychain="$signing/release.keychain-db"
          security list-keychains -d user | tr -d '"' | xargs > "$signing/keychains"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$signing/certificate.p12"
          security import "$signing/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$signing/certificate.p12"
          # Apple's Developer ID G2 intermediate issues the certificate. Importing it keeps the
          # chain complete whatever the runner image carries.
          security import apple/certificates/DeveloperIDG2CA.cer -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" \
            "$keychain" > /dev/null
          # shellcheck disable=SC2046  # one path per word
          security list-keychains -d user -s "$keychain" $(cat "$signing/keychains")
          # Only valid identities are listed: an expired certificate stops here.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -F "\"$MACOS_CERTIFICATE_NAME\"" | awk '{print $2}')"
          if [[ ! "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "::error::The keychain has no valid identity named MACOS_CERTIFICATE_NAME"
            # Every identity with the reason it is not valid, such as CSSMERR_TP_NOT_TRUSTED.
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"

          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          for variable in MACOS_APP_PROFILE_BASE64 MACOS_NETWORK_EXTENSION_PROFILE_BASE64; do
            printf '%s' "${!variable}" | base64 --decode > "$signing/profile"
            uuid="$(security cms -D -i "$signing/profile" | plutil -extract UUID raw -)"
            mv "$signing/profile" "$profiles/$uuid.provisionprofile"
            echo "$profiles/$uuid.provisionprofile" >> "$signing/profiles"
          done

          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$signing/AuthKey.p8"
          chmod 600 "$signing/AuthKey.p8"

      # Google Drive backup needs the project's OAuth client (docs/maintenance.md §2.8); the
      # build bundles it, and a build without one has no Google Drive backup.
      - name: Google OAuth client
        env:
          SOLARIS_GOOGLE_CLIENT_ID: ${{ secrets.SOLARIS_GOOGLE_CLIENT_ID }}
          SOLARIS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLARIS_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "$SOLARIS_GOOGLE_CLIENT_ID" || -z "$SOLARIS_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::warning::No Google OAuth client in the release environment; this app has no Google Drive backup."
          fi

      - name: Rosetta for the x64 Python compiler
        run: |
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Build and sign Solaris.app
        env:
          SOLARIS_GOOGLE_CLIENT_ID: ${{ secrets.SOLARIS_GOOGLE_CLIENT_ID }}
          SOLARIS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLARIS_GOOGLE_CLIENT_SECRET }}
        run: uv run --frozen --with nuitka==4.2.2 python scripts/build_app.py

      # The app is notarized and stapled first, so that it opens offline once copied out of
      # the image; then the image itself.
      - name: Notarize the app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/app/Solaris.app "$RUNNER_TEMP/Solaris.zip"
          uv run --no-project python scripts/notarize.py "$RUNNER_TEMP/Solaris.zip"
          xcrun stapler staple build/app/Solaris.app
          xcrun stapler validate build/app/Solaris.app
          # Notarization accepted and the ticket stapled are the gate. Gatekeeper's own checks
          # only warn (docs/maintenance.md §3): on the runner syspolicy_check stops at an
          # internal XProtect error that it does not report on a Mac, and spctl rejects the
          # app over items it takes for unsigned code although Apple notarized it. Opening the
          # downloaded image on the test Mac decides (§2.2).
          syspolicy_check distribution build/app/Solaris.app \
            || echo "::warning::syspolicy_check did not pass the app; see its report above"
          spctl --status || true
          spctl --assess --type execute -vvv build/app/Solaris.app \
            || echo "::warning::spctl rejected the notarized app; open the image on the test Mac"

      # Solaris.app beside a shortcut to /Applications in a fixed Finder window over
      # package/dmg's background, HFS+ with LZMA compression; the script checks the image.
      - name: Disk image
        env:
          DMG: ${{ steps.version.outputs.dmg }}
        run: |
          uv run --no-project --with dmgbuild==1.6.7 python scripts/build_dmg.py \
            build/app/Solaris.app "build/release/$DMG"
          codesign --force --sign "$IDENTITY" --timestamp "build/release/$DMG"
          codesign --verify --strict "build/release/$DMG"

      - name: Notarize the disk image
        env:
          DMG: ${{ steps.version.outputs.dmg }}
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          uv run --no-project python scripts/notarize.py "build/release/$DMG"
          xcrun stapler staple "build/release/$DMG"
          xcrun stapler validate "build/release/$DMG"
          hdiutil verify "build/release/$DMG"
          cd build/release
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat "$DMG.sha256"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: solaris-${{ steps.version.outputs.version }}-macos-universal
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain macOS crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: solaris-${{ steps.version.outputs.version }}-macos-symbols-${{ github.sha }}
          path: |
            build/apple/symbols/
            build/app/symbols/
          if-no-files-found: error
          retention-days: 90

      # When a step after signing fails, the app as it stands goes up for inspection.
      - name: Keep the app for inspection
        if: failure()
        run: |
          [[ -d build/app/Solaris.app ]] || exit 0
          ditto -c -k --sequesterRsrc --keepParent build/app/Solaris.app "$RUNNER_TEMP/Solaris-inspect.zip"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: solaris-app-inspect
          path: ${{ runner.temp }}/Solaris-inspect.zip
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Clean up signing materials
        if: always()
        run: |
          signing="$RUNNER_TEMP/signing"
          [[ -d "$signing" ]] || exit 0
          if [[ -f "$signing/keychains" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$signing/keychains")
          fi
          security delete-keychain "$signing/release.keychain-db" || true
          if [[ -f "$signing/profiles" ]]; then
            while IFS= read -r profile; do rm -f "$profile"; done < "$signing/profiles"
          fi
          rm -rf "$signing"

  windows:
    name: Windows ${{ matrix.arch }} (signed)
    runs-on: ${{ matrix.os }}
    environment: release
    timeout-minutes: 120
    # GitHub's OIDC token for azure/login: Azure's federated credential for the signing
    # identity trusts this repository's release environment and nothing else.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            python_arch: x86_64
            build: build/windows
          - os: windows-11-arm
            arch: arm64
            python_arch: aarch64
            build: build/windows-arm64
    env:
      UV_PYTHON_ARCH: ${{ matrix.python_arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: NSIS
        run: choco install nsis --yes --no-progress
      - name: Install (locked)
        run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: build/geodata
          key: geodata-${{ hashFiles('scripts/fetch_geodata.py') }}
      - name: Version
        id: version
        shell: bash
        run: |
          version="$(uv run --no-project python -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "installer=Solaris-$version-windows-${{ matrix.arch }}-setup.exe" >> "$GITHUB_OUTPUT"

      - name: Google OAuth client
        shell: bash
        env:
          SOLARIS_GOOGLE_CLIENT_ID: ${{ secrets.SOLARIS_GOOGLE_CLIENT_ID }}
          SOLARIS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLARIS_GOOGLE_CLIENT_SECRET }}
        run: |
          if [[ -z "$SOLARIS_GOOGLE_CLIENT_ID" || -z "$SOLARIS_GOOGLE_CLIENT_SECRET" ]]; then
            echo "::warning::No Google OAuth client in the release environment; this installer has no Google Drive backup."
          fi

      # --sign links the service with SignedRelease: it accepts only a UI with Solaris's
      # signature (docs/architecture.md §5.3). Signing comes after the long build, so that the
      # Azure sign-in below is fresh when the first file is signed.
      - name: Build Solaris.exe and the service
        env:
          SOLARIS_GOOGLE_CLIENT_ID: ${{ secrets.SOLARIS_GOOGLE_CLIENT_ID }}
          SOLARIS_GOOGLE_CLIENT_SECRET: ${{ secrets.SOLARIS_GOOGLE_CLIENT_SECRET }}
        run: uv run --frozen --with nuitka==4.2.2 python scripts/build_windows.py --arch ${{ matrix.arch }} --skip-installer --sign

      # Azure Artifact Signing (D42, docs/release.md §1): signtool with Artifact Signing's dlib,
      # both x64, at exact versions with their SHA-256. The dlib is built only for x86 and x64,
      # so the ARM64 runner runs both under Windows 11's x64 emulation, with an x64 .NET beside
      # the native one in C:\Program Files\dotnet\x64; what they sign may be any architecture.
      # metadata.json names the account and the certificate profile, and leaves the dlib only
      # the Azure CLI's sign-in.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          architecture: x64
      - name: Signing tools
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($variable in 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_PROFILE') {
            if (-not [Environment]::GetEnvironmentVariable($variable)) {
              throw "The release environment has no variable $variable"
            }
          }
          $tools = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Path $tools | Out-Null
          $packages = @(
            @{ Id = 'Microsoft.Windows.SDK.BuildTools'; Version = '10.0.28000.2705'
               Sha256 = '8bfdfb6ca2633f531cf80b5fa22512ba61a394d7988f0970db83baadc67929ed' },
            @{ Id = 'Microsoft.ArtifactSigning.Client'; Version = '1.0.151'
               Sha256 = '35375a4bc4e1102da729fc3d8d9925f774c3baae6b8b7ff6398d948ca9ab0d8a' }
          )
          foreach ($package in $packages) {
            $id = $package.Id.ToLowerInvariant()
            $archive = Join-Path $tools "$id.nupkg"
            Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/$id/$($package.Version)/$id.$($package.Version).nupkg" -OutFile $archive
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
            if ($hash -ne $package.Sha256) {
              throw "$($package.Id) $($package.Version) has SHA-256 $hash, not $($package.Sha256)"
            }
            [IO.Compression.ZipFile]::ExtractToDirectory($archive, (Join-Path $tools $package.Id))
          }
          $signtool = Join-Path $tools 'Microsoft.Windows.SDK.BuildTools\bin\10.0.28000.0\x64\signtool.exe'
          $dlib = Join-Path $tools 'Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          $metadata = Join-Path $tools 'metadata.json'
          [ordered]@{
            Endpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:ARTIFACT_SIGNING_ACCOUNT
            CertificateProfileName = $env:ARTIFACT_SIGNING_PROFILE
            CorrelationId = "solaris-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:ARCH"
            ExcludeCredentials = @(
              'EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
          Get-Content -LiteralPath $metadata
          & dotnet --list-runtimes
          foreach ($file in $signtool, $dlib) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "No $file" }
          }
          "SIGNTOOL=$signtool" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV
          "ARTIFACT_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV

      # The user-assigned managed identity id-solaris-release, through its federated credential
      # for this environment. Its only role is signer on the certificate profile, none in the
      # subscription, so the sign-in names no subscription: azure/login would select
      # AZURE_SUBSCRIPTION_ID and fail. The Azure CLI exchanges GitHub's short-lived token for
      # each new access token, so the signing token is fetched at once and then cached for the
      # dlib, which asks the CLI for it; only its expiry is printed.
      - name: Sign in to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Signing token
        run: az account get-access-token --scope https://codesigning.azure.net/.default --query expiresOn --output tsv

      # package/windows/sign.ps1 signs every program in the install directory without a
      # publisher's signature, then the setup UI's plugin, the uninstaller and the installer
      # (makensis' !uninstfinalize and !finalize), each with a timestamp, and checks each
      # one: Windows trusts it, and the certificate is Herta Network LLC's with the
      # certificate profile's extended key usage. Any failure fails the job.
      - name: Sign and build the installer
        run: uv run --frozen python scripts/build_windows.py --arch ${{ matrix.arch }} --installer-only --sign

      # The installer as it is uploaded: its signature, chain and timestamp, for the log.
      - name: Check the signatures
        shell: pwsh
        env:
          INSTALLER: ${{ matrix.build }}/${{ steps.version.outputs.installer }}
          DIRECTORY: ${{ matrix.build }}/Solaris
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:SIGNTOOL verify /pa /v $env:INSTALLER
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
          ./package/windows/sign.ps1 -Check $env:INSTALLER "$env:DIRECTORY/Solaris.exe" "$env:DIRECTORY/solaris-service.exe"
          if ($LASTEXITCODE -ne 0) { throw 'The installer or the programs are not signed as a release signs them' }
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER
          $signature.SignerCertificate | Format-List Subject, Issuer, Thumbprint, NotBefore, NotAfter, EnhancedKeyUsageList
          $signature.TimeStamperCertificate | Format-List Subject, Issuer

      - name: Install, upgrade and uninstall
        shell: powershell
        env:
          INSTALLER: ${{ matrix.build }}/${{ steps.version.outputs.installer }}
        run: ./package/windows/smoke-test.ps1 -Installer $env:INSTALLER -Signed
      # The UI's output from each start, and the crash directory of one that died starting.
      - name: Keep the UI's output and crash logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: solaris-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-ui
          path: ${{ runner.temp }}/solaris-ui/
          if-no-files-found: ignore
          retention-days: 14

      - name: Checksum
        shell: bash
        env:
          INSTALLER: ${{ steps.version.outputs.installer }}
          BUILD_DIR: ${{ matrix.build }}
        run: |
          mkdir -p build/release
          cp "$BUILD_DIR/$INSTALLER" build/release/
          cd build/release
          sha256sum "$INSTALLER" > "$INSTALLER.sha256"
          cat "$INSTALLER.sha256"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: solaris-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}
          path: build/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Retain Windows crash symbols
        uses: actions/upload-artifact@v7
        with:
          name: solaris-${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}-symbols-${{ github.sha }}
          path: |
            ${{ matrix.build }}/symbols/
            ${{ matrix.build }}/nsis/ui/*.pdb
          if-no-files-found: error
          retention-days: 90

  # The GitHub Release of a v* tag, with exactly the assets of docs/release.md §1. It stays a
  # draft: the updater asks GitHub for the latest published release, which skips drafts, so
  # nothing reaches installed copies until a person has downloaded the installers from the
  # draft, tried them and written the notes, then publishes it. In the release environment
  # like the builds, so that only its reviewers' runs write to the repository's releases.
  release:
    name: Draft GitHub Release
    needs: [macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/core/go.mod
          cache-dependency-path: src/core/go.sum
      - name: Version
        id: version
        run: |
          version="$(python3 -c \
            'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi
          # The updater reads only X.Y.Z tags (docs/release.md §2).
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version $version is not X.Y.Z"
            exit 1
          fi
          {
            echo "version=$version"
            echo "dmg=Solaris-$version-macos-universal.dmg"
            echo "installer=Solaris-$version-windows-x64-setup.exe"
            echo "installer_arm64=Solaris-$version-windows-arm64-setup.exe"
            echo "source=Solaris-$version-source"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          name: solaris-${{ steps.version.outputs.version }}-macos-universal
          path: build/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: solaris-${{ steps.version.outputs.version }}-windows-x64
          path: build/artifacts
      - uses: actions/download-artifact@v8
        with:
          name: solaris-${{ steps.version.outputs.version }}-windows-arm64
          path: build/artifacts

      # The build jobs' own sums first: the artifacts arrived as they were built.
      - name: Installers
        env:
          DMG: ${{ steps.version.outputs.dmg }}
          INSTALLER: ${{ steps.version.outputs.installer }}
          INSTALLER_ARM64: ${{ steps.version.outputs.installer_arm64 }}
        run: |
          cd build/artifacts
          sha256sum --check --strict "$DMG.sha256" "$INSTALLER.sha256" "$INSTALLER_ARM64.sha256"
          mkdir -p ../release
          mv "$DMG" "$INSTALLER" "$INSTALLER_ARM64" ../release/

      # The tagged tree and every Go module the service and the extension link, so that
      # the archive builds without the network (GPL-3.0's corresponding source). Ordered,
      # owned by root and dated at the tagged commit, so that the same tag gives the same
      # archive.
      - name: Source archive
        env:
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          staging="$RUNNER_TEMP/source"
          mkdir -p "$staging"
          git archive --format=tar --prefix="$SOURCE/" HEAD | tar -x -C "$staging"
          go -C "$staging/$SOURCE/src/core" mod vendor
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" GOFLAGS=-mod=vendor GOPROXY=off \
              go -C "$staging/$SOURCE/src/core" build -tags with_gvisor,with_naive,with_purego -o /dev/null ./service
          done
          tar --sort=name --mtime="$(git log -1 --format=%cI)" --owner=0 --group=0 \
            --numeric-owner --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
            -C "$staging" -cf - "$SOURCE" | gzip -9n > "build/release/$SOURCE.tar.gz"

      - name: SHA256SUMS
        env:
          DMG: ${{ steps.version.outputs.dmg }}
          INSTALLER: ${{ steps.version.outputs.installer }}
          INSTALLER_ARM64: ${{ steps.version.outputs.installer_arm64 }}
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          cd build/release
          sha256sum "$DMG" "$INSTALLER" "$INSTALLER_ARM64" "$SOURCE.tar.gz" > SHA256SUMS
          cat SHA256SUMS
          ls -l

      # The notes come from .github/release-notes.md; the changes are written in the draft.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.version.outputs.dmg }}
          INSTALLER: ${{ steps.version.outputs.installer }}
          INSTALLER_ARM64: ${{ steps.version.outputs.installer_arm64 }}
          SOURCE: ${{ steps.version.outputs.source }}
        run: |
          sed "s/{{version}}/$VERSION/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          if grep -q "{{" "$RUNNER_TEMP/notes.md"; then
            echo "::error::.github/release-notes.md has a placeholder other than {{version}}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Solaris $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "build/release/$DMG" "build/release/$INSTALLER" "build/release/$INSTALLER_ARM64" \
            build/release/SHA256SUMS "build/release/$SOURCE.tar.gz"
