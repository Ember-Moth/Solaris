syntax = "proto3";
package solaris.control.v1;

option go_package = "github.com/Ember-Moth/Solaris/src/core/internal/controlpb;controlpb";

// Draft of control protocol version 1 (docs/architecture.md §4). The same messages travel
// over the Windows service pipe (framed) and macOS provider messages (one per call).
// Field numbers are never reused; incompatible changes bump protocol_version.

message Request {
  uint32 protocol_version = 1;
  uint64 id = 2;
  oneof method {
    // Host methods. GetInfo and Reload also run in the macOS extension; the rest are
    // Windows-service only because macOS starts and stops through NETunnelProviderManager.
    GetInfoRequest get_info = 10;
    ClaimRequest claim = 11;
    ValidateRequest validate = 12;
    StartRequest start = 13;
    ReloadRequest reload = 14;
    StopRequest stop = 15;
    SetSystemProxyRequest set_system_proxy = 16;

    // Core methods, served on both platforms.
    GetStatusRequest get_status = 30;
    SetModeRequest set_mode = 31;
    ListGroupsRequest list_groups = 32;
    GetGroupRequest get_group = 33;
    SelectProxyRequest select_proxy = 34;
    HealthCheckRequest health_check = 35;
    TestDelayRequest test_delay = 36;
    ListProvidersRequest list_providers = 37;
    UpdateProviderRequest update_provider = 38;
    ListRulesRequest list_rules = 39;
    CloseConnectionRequest close_connection = 40;
    CloseAllConnectionsRequest close_all_connections = 41;
    FlushFakeIPRequest flush_fake_ip = 42;
    FlushDNSCacheRequest flush_dns_cache = 43;
    SubscribeLogsRequest subscribe_logs = 44;
    SubscribeTrafficRequest subscribe_traffic = 45;
    SubscribeConnectionsRequest subscribe_connections = 46;
    PollEventsRequest poll_events = 47;
    UnsubscribeRequest unsubscribe = 48;

    // Routing methods (docs/routing.md §8.2), served on both platforms. They only read
    // and need no running core.
    InspectSourceRequest inspect_source = 49;
    ListGeoCategoriesRequest list_geo_categories = 50;
    PreviewGroupRequest preview_group = 51;
    MatchRuleRequest match_rule = 52;
    ConvertToPlanRequest convert_to_plan = 53;
    ExportPlanRequest export_plan = 54;

    // Chained exits (docs/exits.md §7.2), served on both platforms; they need a running
    // core, since they go out through one of its groups.
    RegisterWarpRequest register_warp = 55;
  }
}

message Response {
  uint32 protocol_version = 1;
  uint64 id = 2;
  oneof result {
    Error error = 3;
    Empty empty = 4;
    GetInfoResponse get_info = 10;
    // Validate, Start and Reload with a Composition; with config_yaml they answer Empty.
    CompositionReport composition = 12;
    GetStatusResponse get_status = 30;
    ListGroupsResponse list_groups = 32;
    GetGroupResponse get_group = 33;
    TestDelayResponse test_delay = 36;
    ListProvidersResponse list_providers = 37;
    ListRulesResponse list_rules = 39;
    SubscribeResponse subscribe = 44;
    PollEventsResponse poll_events = 47;
    InspectSourceResponse inspect_source = 49;
    ListGeoCategoriesResponse list_geo_categories = 50;
    PreviewGroupResponse preview_group = 51;
    MatchRuleResponse match_rule = 52;
    ConvertToPlanResponse convert_to_plan = 53;
    ExportPlanResponse export_plan = 54;
    RegisterWarpResponse register_warp = 55;
  }
}

message Empty {}

message Error {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

enum RunState {
  RUN_STATE_UNSPECIFIED = 0;
  RUN_STATE_STOPPED = 1;
  RUN_STATE_STARTING = 2;
  RUN_STATE_RUNNING = 3;
  RUN_STATE_STOPPING = 4;
  RUN_STATE_FAILED = 5;
}

enum Ownership {
  OWNERSHIP_UNSPECIFIED = 0; // macOS: the system restricts the session to this app.
  OWNERSHIP_AVAILABLE = 1;
  OWNERSHIP_CALLER = 2;
  OWNERSHIP_OTHER = 3;
}

message GetInfoRequest {}
message GetInfoResponse {
  uint32 protocol_version = 1;
  string service_version = 2;
  string core_version = 3;
  RunState state = 4;
  Ownership ownership = 5;
}

message ClaimRequest {}

// mihomo's TUN stacks (docs/architecture.md §3.4). gVisor and mixed need a core built with
// with_gvisor; the macOS extension replaces system and mixed with gVisor while its tunnel
// includes all networks (D19).
enum TunStack {
  TUN_STACK_UNSPECIFIED = 0; // the profile's own tun.stack
  TUN_STACK_SYSTEM = 1;
  TUN_STACK_MIPS = 2;
  TUN_STACK_GVISOR = 3;
  TUN_STACK_MIXED = 4;
}

message RunOptions {
  bool tun_enabled = 1;
  bool system_proxy_enabled = 2;
  uint32 mixed_port = 3;
  bool allow_lan = 4;
  TunStack tun_stack = 5;
}

// Validate, Start and Reload take the configuration from one of two sources: a
// subscription's own YAML, or a Composition the core assembles from the node pool and a
// plan (docs/routing.md §8.1). The overrides apply after either.
message ValidateRequest {
  oneof source {
    string config_yaml = 1;
    Composition composition = 4;
  }
  repeated string overrides = 2;
}
message StartRequest {
  oneof source {
    string config_yaml = 1;
    Composition composition = 4;
  }
  repeated string overrides = 2;
  RunOptions options = 3;
}
message ReloadRequest {
  oneof source {
    string config_yaml = 1;
    Composition composition = 4;
  }
  repeated string overrides = 2;
  RunOptions options = 3;
}

// The node pool and a plan, for "my plan" routing (docs/routing.md §8.5).
message Composition {
  // The subscriptions in the pool, in the order they were imported; the UI leaves out the
  // ones kept out of the pool. A node whose name an earlier subscription took gets
  // " · <subscription name>" appended.
  repeated CompositionSource sources = 1;
  // A regular expression in mihomo's syntax (regexp2) for information nodes such as
  // "剩余流量"; the pool leaves out nodes whose names match it. Empty leaves out none.
  string info_filter = 2;
  // The plan as JSON, format version 1 (docs/routing.md §8.5).
  string plan_json = 3;
  // What the chained exits need (docs/exits.md §7.1). Without an exit's material the exit
  // is unavailable, and the rules that name it reject their connections (decision D21).
  Egress egress = 4;
}
message Egress {
  WarpAccount warp = 1;
  // 2: the Tor exit (M10); 3: the VPN Gate exit (M12).
  reserved 2, 3;
}
enum WarpProtocol {
  WARP_PROTOCOL_UNSPECIFIED = 0; // MASQUE over HTTP/2
  WARP_PROTOCOL_MASQUE_H2 = 1;
  WARP_PROTOCOL_MASQUE_H3 = 2;
  WARP_PROTOCOL_WIREGUARD = 3;
}
// A Cloudflare WARP device, as RegisterWarp made it (docs/exits.md §3.2). It is a
// credential: the UI keeps it in the system's credential store, out of backups, and hands
// it back unchanged in every Composition; the core keeps it in memory only.
message WarpAccount {
  string device_id = 1;
  string token = 2;
  WarpProtocol protocol = 3; // the key below is for this protocol
  string private_key = 4;     // as mihomo's outbound takes it
  string peer_public_key = 5; // as mihomo's outbound takes it
  string endpoint = 6;        // host:port the outbound dials
  string address_v4 = 7;      // the device's addresses inside the tunnel
  string address_v6 = 8;
  string client_id = 9;       // base64; WireGuard's "reserved" bytes come from it
  int64 registered_at_unix_ms = 10;
}
message CompositionSource {
  string id = 1;
  string name = 2;
  string yaml = 3; // the subscription as downloaded: a mihomo profile or share links
}

message CompositionReport {
  repeated CompositionWarning warnings = 1;
  repeated ComposedGroup groups = 2; // in configuration order
  // Every rule the plan produced, in order, with the rule entry it came from.
  repeated Rule rules = 3;
  repeated PoolNode nodes = 4; // the pool after exclusions, in order
  // Tailscale, ZeroTier and EasyTier outbounds from the pool's subscriptions: kept out of
  // the pool and of every group, and offered as rule targets (docs/mesh.md §3).
  repeated MeshOutbound mesh = 5;
}
message MeshOutbound {
  string id = 1;        // "mesh:<subscription id>/<name in the subscription>", as plans name it
  string name = 2;      // the name in the generated configuration
  string type = 3;      // mihomo adapter type, as in Proxy.type
  string source_id = 4;
}
message CompositionWarning {
  string entry_id = 1; // a rule entry, or "fallback"
  // "region_empty": the target region has no nodes; "group_empty": the target group has
  // no members. The entry goes to the built-in "proxy" group until that changes.
  // "egress_unavailable": the target exit has no material in Composition.egress, and
  // "mesh_missing": the target mesh outbound is gone; the entry rejects its connections.
  // "via_empty": an exit's via group has no members (entry_id is the exit, such as
  // "egress:warp"; target the group); the exit goes out through "proxy" meanwhile.
  // "mesh_restricted": a mesh outbound option that serves other devices was turned off
  // (entry_id is the outbound's mesh id; target the option); docs/mesh.md §4.
  string reason = 2;
  string target = 3; // the target the plan names
}
enum GroupKind {
  GROUP_KIND_UNSPECIFIED = 0;
  GROUP_KIND_BUILTIN = 1;
  GROUP_KIND_REGION = 2;
  GROUP_KIND_CUSTOM = 3;
}
message ComposedGroup {
  string id = 1;   // "proxy", "auto", "region:HK" or the plan's own id
  string name = 2; // the name in the generated configuration
  GroupKind kind = 3;
  string region = 4; // region groups only: the region code
  uint32 node_count = 5;
}
message PoolNode {
  string name = 1;          // the name in the generated configuration
  string original_name = 2; // the name in the subscription
  string source_id = 3;
  string type = 4;   // mihomo adapter type, as in Proxy.type
  string region = 5; // region code; "ZZ" when no region matched
}
message StopRequest {}
message SetSystemProxyRequest { bool enabled = 1; }

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_RULE = 1;
  MODE_GLOBAL = 2;
  MODE_DIRECT = 3;
}

message GetStatusRequest {}
message GetStatusResponse {
  RunState state = 1;
  Mode mode = 2;
  uint64 started_at_unix_ms = 3;
  uint64 memory_bytes = 4;
  uint32 connection_count = 5;
  optional Error last_error = 6;
  bool tun_enabled = 7;
  bool system_proxy_enabled = 8;
}
message SetModeRequest { Mode mode = 1; }

enum GroupSort {
  GROUP_SORT_UNSPECIFIED = 0; // configuration order
  GROUP_SORT_NAME = 1;
  GROUP_SORT_DELAY = 2;
}
message Proxy {
  string name = 1;
  string type = 2;
  optional uint32 delay_ms = 3; // absent until tested; 0 when the last test failed
}
message ProxyGroup {
  string name = 1;
  string type = 2;
  string now = 3;
  string test_url = 4;
  repeated Proxy proxies = 5;
}
message ListGroupsRequest {
  GroupSort sort = 1;
  bool exclude_not_selectable = 2;
}
message ListGroupsResponse { repeated ProxyGroup groups = 1; }
message GetGroupRequest {
  string name = 1;
  GroupSort sort = 2;
}
message GetGroupResponse { ProxyGroup group = 1; }
message SelectProxyRequest {
  string group = 1;
  string proxy = 2;
}
message HealthCheckRequest { string group = 1; } // empty checks every group
message TestDelayRequest {
  string proxy = 1;
  string test_url = 2;
  uint32 timeout_ms = 3;
}
message TestDelayResponse { uint32 delay_ms = 1; }

enum ProviderKind {
  PROVIDER_KIND_UNSPECIFIED = 0;
  PROVIDER_KIND_PROXY = 1;
  PROVIDER_KIND_RULE = 2;
}
message Provider {
  string name = 1;
  ProviderKind kind = 2;
  string vehicle_type = 3;
  uint64 updated_at_unix_ms = 4;
}
message ListProvidersRequest {}
message ListProvidersResponse { repeated Provider providers = 1; }
message UpdateProviderRequest {
  ProviderKind kind = 1;
  string name = 2;
}

message Rule {
  string type = 1;
  string payload = 2;
  string proxy = 3;
  // The plan's rule entry this rule came from, or "fallback"; empty for rules that a
  // subscription or an override wrote.
  string entry_id = 4;
}
message ListRulesRequest {}
message ListRulesResponse { repeated Rule rules = 1; }

message CloseConnectionRequest { string id = 1; }
message CloseAllConnectionsRequest {}
message FlushFakeIPRequest {}
message FlushDNSCacheRequest {}

enum LogLevel {
  LOG_LEVEL_UNSPECIFIED = 0;
  LOG_LEVEL_DEBUG = 1;
  LOG_LEVEL_INFO = 2;
  LOG_LEVEL_WARNING = 3;
  LOG_LEVEL_ERROR = 4;
}
message SubscribeLogsRequest { LogLevel level = 1; }
message SubscribeTrafficRequest {}
message SubscribeConnectionsRequest {}
message SubscribeResponse { uint64 subscription_id = 1; }
message PollEventsRequest {
  uint64 subscription_id = 1;
  uint32 max_events = 2;
}
message PollEventsResponse {
  repeated Event events = 1;
  uint64 dropped = 2; // events discarded since the previous poll because the buffer was full
}
message UnsubscribeRequest { uint64 subscription_id = 1; }

message Event {
  oneof payload {
    LogEntry log = 1;
    TrafficSample traffic = 2;
    ConnectionSnapshot connections = 3;
  }
}
message LogEntry {
  LogLevel level = 1;
  string message = 2;
  uint64 time_unix_ms = 3;
}
message TrafficSample {
  uint64 up_bytes_per_second = 1;
  uint64 down_bytes_per_second = 2;
  uint64 up_total_bytes = 3;
  uint64 down_total_bytes = 4;
}
message Connection {
  string id = 1;
  string network = 2;
  string source = 3;
  string destination = 4;
  string host = 5;
  string process = 6;
  repeated string chains = 7;
  string rule = 8;
  string rule_payload = 9;
  uint64 upload_bytes = 10;
  uint64 download_bytes = 11;
  uint64 started_at_unix_ms = 12;
  string rule_entry_id = 13; // Rule.entry_id of the rule the connection matched
}
message ConnectionSnapshot { repeated Connection connections = 1; }

message InspectSourceRequest {
  string yaml = 1;        // a subscription as downloaded
  string info_filter = 2; // as in Composition
}
message InspectSourceResponse {
  repeated SourceNode nodes = 1;
  bool has_rules = 2;
  uint32 group_count = 3;
  uint32 rule_count = 4;
}
message SourceNode {
  string name = 1;
  string type = 2;   // mihomo adapter type, as in Proxy.type
  string region = 3; // region code; "ZZ" when no region matched
  bool info = 4;     // the name matches info_filter, so the pool leaves the node out
  bool mesh = 5;     // a Tailscale, ZeroTier or EasyTier outbound, kept out of the pool
}

// Registers a WARP device through a group of the running configuration, or gives an
// existing one a key for another protocol (docs/exits.md §3.2). Failures are
// operation_failed with Cloudflare's text; not_running while the core is stopped.
message RegisterWarpRequest {
  string via = 1; // the group's name in the running configuration
  WarpProtocol protocol = 2;
  // An existing device to re-key; both empty registers a new one.
  string device_id = 3;
  string token = 4;
}
message RegisterWarpResponse { WarpAccount account = 1; }

message ListGeoCategoriesRequest {}
message ListGeoCategoriesResponse {
  GeoCategories geosite = 1;
  GeoCategories geoip = 2;
}
// The categories in one GEO data file of the core's home, lower-cased and sorted. Without
// the file, every field is empty.
message GeoCategories {
  repeated string names = 1;
  string sha256 = 2; // of the file, which identifies the data release
  uint64 updated_at_unix_ms = 3;
}

// The members a group of a plan draft gets with the pool, for the group editor's preview
// (docs/routing.md §4.5).
message PreviewGroupRequest {
  Composition composition = 1; // the pool, and the draft plan that holds the group
  string group_id = 2;         // "proxy", "auto", "region:HK" or a custom group's id
}
message PreviewGroupResponse {
  repeated PoolNode nodes = 1; // the member nodes, in pool order
  // The other members by id, as the group lists them in the configuration: group ids,
  // "region:JP" for each region group with nodes, DIRECT, REJECT, REJECT-DROP.
  repeated string others = 2;
}

// Which rule a connection to host would match (docs/routing.md §8.3), with mihomo's own
// rule matching. Without a source the running configuration answers; with one, the core
// builds that configuration on the side as Validate does and never applies it.
message MatchRuleRequest {
  oneof source {
    string config_yaml = 1;
    Composition composition = 2;
  }
  repeated string overrides = 3;
  string host = 4;    // a domain or an IP address
  uint32 port = 5;    // 0 means 443
  string network = 6; // "tcp" (the default) or "udp"
}
message MatchRuleResponse {
  bool matched = 1; // false: no rule matched, and mihomo sends the connection DIRECT
  uint32 index = 2; // the rule's position in the configuration's rules
  Rule rule = 3;    // with the plan's rule entry when the configuration is a composition
  // From the node to the rule's target, as Connection.chains: the running core's current
  // choice in each group on the way. When the core does not run that group, the chain is
  // the target alone.
  repeated string chain = 4;
  // The address the domain resolved to when a rule needed one; empty otherwise, or when
  // the lookup failed.
  string resolved_ip = 5;
}

// A subscription's or a mihomo configuration's groups and rules as a plan (docs/routing.md
// §4.7).
message ConvertToPlanRequest {
  string yaml = 1;
  // The subscription in the pool the YAML came from, so groups can pick its nodes; empty
  // for a configuration imported on its own, whose nodes are matched by name.
  string source_id = 2;
  string locale = 3;      // the plan's: "zh" (the default) or "en"
  string info_filter = 4; // as in Composition
}
message ConvertToPlanResponse {
  string plan_json = 1; // format version 1 (docs/routing.md §8.5)
  uint32 group_count = 2;  // the groups the YAML has
  uint32 merged_group_count = 3; // of them, merged into 节点选择 or 自动选择
  uint32 rule_count = 4;   // the rules the YAML has, MATCH included
  uint32 raw_rule_count = 5; // of them, kept as raw rule entries
  uint32 entry_count = 6;  // the rule entries of the plan; neighbouring rules may share one
  repeated SkippedRule skipped = 7; // the rules the plan does not keep
}
message SkippedRule {
  string rule = 1; // as the YAML wrote it
  // "rule_set": RULE-SET, or a logical rule with one; "sub_rule": SUB-RULE, or a logical
  // rule with one; "target": a target that is neither a group nor an outbound;
  // "after_match": after MATCH, so never reached; "invalid": a rule mihomo would refuse.
  string reason = 2;
}

enum ExportFormat {
  EXPORT_FORMAT_UNSPECIFIED = 0; // as SHARE
  // proxy-groups and rules for another mihomo configuration: members as include-all with
  // filters where the conditions allow it, nodes by their names in the subscription.
  EXPORT_FORMAT_SHARE = 1;
  // The whole configuration the core would run, after the overrides, the platform patches
  // and the security items; nodes show their name, type, server and port only.
  EXPORT_FORMAT_GENERATED = 2;
}
message ExportPlanRequest {
  Composition composition = 1;
  ExportFormat format = 2;
  repeated string overrides = 3; // GENERATED only
  RunOptions options = 4;        // GENERATED only
}
message ExportPlanResponse { string yaml = 1; }
